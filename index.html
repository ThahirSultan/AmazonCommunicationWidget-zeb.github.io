
​<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="modulepreload" href="https://esm.sh/amazon-chime-sdk-js@3">

    <style>
        /* ── Base ── */
        :root {
            --swamp-green: #4a5d23;
            --grass-green: #7cb342;
        }

        body {
            background: linear-gradient(135deg, var(--swamp-green) 0%, var(--grass-green) 50%, var(--swamp-green) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 1rem;
        }

        /* ── Container ── */
        .zeb-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 3rem 4rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 3px solid var(--grass-green);
            animation: glow 2s ease-in-out infinite alternate;
            width: 100%;
            max-width: 480px;
            transition: max-width 0.3s ease;
        }

        .zeb-container.chat-active {
            max-width: 520px;
        }

        /* ── ZEB heading ── */
        .zeb-text {
            font-size: 7rem;
            font-weight: bold;
            color: var(--grass-green);
            text-shadow: 0 0 10px var(--grass-green), 0 0 20px var(--grass-green), 0 0 30px var(--grass-green);
            letter-spacing: 0.5rem;
            animation: pulse 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 0;
        }

        .zeb-text:hover {
            color: #ffffff;
            text-shadow: 0 0 15px var(--grass-green), 0 0 35px var(--grass-green), 0 0 45px var(--grass-green);
            transform: scale(1.1);
        }

        /* ── Tab switcher ── */
        .tab-switcher {
            display: flex;
            justify-content: center;
            gap: 0;
            margin: 1.25rem 0 0;
            border: 1px solid rgba(124, 179, 66, 0.35);
            border-radius: 50px;
            padding: 3px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08rem;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--grass-green);
            color: #ffffff;
        }

        .tab-btn:not(.active):hover {
            color: var(--grass-green);
        }

        /* ── Shared controls wrapper ── */
        .call-controls {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }

        /* ── Status line ── */
        .call-status {
            font-size: 0.92rem;
            color: #aaaaaa;
            letter-spacing: 0.05rem;
            min-height: 1.2rem;
        }

        .call-status.active { color: var(--grass-green); }
        .call-status.error  { color: #e53935; }

        /* ── Button row ── */
        .btn-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ── Control buttons ── */
        .ctrl-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05rem;
            transition: all 0.25s ease;
            min-width: 100px;
        }

        .ctrl-btn svg { width: 22px; height: 22px; }

        .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .btn-start {
            background-color: var(--grass-green);
            color: #ffffff;
            border-color: var(--grass-green);
        }

        .btn-start:hover:not(:disabled) {
            background-color: #5a8a2a;
            box-shadow: 0 0 15px var(--grass-green);
        }

        .btn-end {
            background-color: #e53935;
            color: #ffffff;
            border-color: #e53935;
        }

        .btn-end:hover:not(:disabled) {
            background-color: #b71c1c;
            box-shadow: 0 0 15px #e53935;
        }

        .btn-toggle {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-toggle:hover:not(:disabled) { background-color: rgba(255, 255, 255, 0.2); }

        .btn-toggle.active {
            background-color: var(--grass-green);
            border-color: var(--grass-green);
        }

        .btn-toggle.off {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #888888;
        }

        /* ── Local video ── */
        #local-video {
            width: 220px;
            height: 140px;
            border-radius: 10px;
            border: 2px solid var(--grass-green);
            background: #000;
            display: none;
            object-fit: cover;
        }

        /* ── Chat window ── */
        .chat-window {
            display: none;
            flex-direction: column;
            width: 100%;
            border: 1px solid rgba(124, 179, 66, 0.3);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
        }

        .chat-window.visible { display: flex; }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            max-height: 280px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--swamp-green) transparent;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--swamp-green); border-radius: 4px; }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 78%;
        }

        .msg-customer { align-self: flex-end; align-items: flex-end; }
        .msg-agent    { align-self: flex-start; align-items: flex-start; }

        .msg-system {
            align-self: center;
            font-size: 0.72rem;
            color: #555;
            font-style: italic;
            max-width: 100%;
            text-align: center;
        }

        .msg-name {
            font-size: 0.68rem;
            color: #888;
            margin-bottom: 3px;
            letter-spacing: 0.03rem;
        }

        .msg-bubble {
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.45;
            word-break: break-word;
        }

        .msg-customer .msg-bubble {
            background-color: var(--grass-green);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .msg-agent .msg-bubble {
            background-color: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            border: 1px solid rgba(124, 179, 66, 0.25);
            border-bottom-left-radius: 4px;
        }

        /* ── Typing indicator ── */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 8px;
            font-size: 0.72rem;
            color: #777;
        }

        .typing-indicator.visible { display: flex; }

        .typing-dots { display: flex; gap: 3px; }

        .typing-dots span {
            width: 5px; height: 5px;
            background: var(--grass-green);
            border-radius: 50%;
            opacity: 0.5;
            animation: typing-bounce 1.2s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* ── Chat input ── */
        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid rgba(124, 179, 66, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(124, 179, 66, 0.35);
            border-radius: 20px;
            padding: 8px 14px;
            color: #ffffff;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .chat-input::placeholder { color: #555; }
        .chat-input:focus        { border-color: var(--grass-green); }
        .chat-input:disabled     { opacity: 0.4; cursor: not-allowed; }

        .btn-send {
            background-color: var(--grass-green);
            color: #ffffff;
            border-color: var(--grass-green);
            border-radius: 50%;
            width: 40px; height: 40px;
            min-width: unset;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            flex-direction: row;
        }

        .btn-send svg { width: 18px; height: 18px; }

        .btn-send:hover:not(:disabled) {
            background-color: #5a8a2a;
            box-shadow: 0 0 12px var(--grass-green);
        }

        /* ── Floating particles ── */
        .particle {
            position: fixed;
            background: var(--grass-green);
            border-radius: 50%;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        /* ── Animations ── */
        @keyframes glow {
            from { box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 20px var(--swamp-green); }
            to   { box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 30px var(--grass-green); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.8; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
            50%       { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        @keyframes typing-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40%           { transform: translateY(-5px); opacity: 1; }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .zeb-text      { font-size: 4rem; }
            .zeb-container { padding: 2rem 2rem; }
            .chat-messages { max-height: 220px; }
        }

        @media (max-width: 480px) {
            .zeb-text      { font-size: 3rem; }
            .zeb-container { padding: 1.5rem 1.25rem; }
            .btn-row       { gap: 0.6rem; }
            .ctrl-btn      { min-width: 80px; font-size: 0.75rem; }
            .chat-messages { max-height: 180px; }
            .chat-message  { max-width: 90%; }
        }
    </style>
</head>

<body>

    <!-- Floating particles -->
    <div class="particle" style="top:10%;left:10%;width:4px;height:4px;animation-delay:0s;position:fixed"></div>
    <div class="particle" style="top:20%;right:20%;width:6px;height:6px;animation-delay:1s;position:fixed"></div>
    <div class="particle" style="bottom:30%;left:30%;width:3px;height:3px;animation-delay:2s;position:fixed"></div>
    <div class="particle" style="bottom:20%;right:10%;width:5px;height:5px;animation-delay:3s;position:fixed"></div>
    <div class="particle" style="top:50%;left:5%;width:4px;height:4px;animation-delay:4s;position:fixed"></div>
    <div class="particle" style="top:70%;right:5%;width:3px;height:3px;animation-delay:5s;position:fixed"></div>

    <div class="zeb-container" id="zebContainer">
        <h1 class="zeb-text" id="zebText">ZEB</h1>

        <!-- Tab switcher -->
        <div class="tab-switcher">
            <button class="tab-btn active" id="tabCall">Voice Call</button>
            <button class="tab-btn"        id="tabChat">Chat</button>
        </div>

        <!-- ── Voice Call Panel ── -->
        <div id="panelCall" class="call-controls">
            <div class="call-status" id="callStatus">Ready to connect</div>

            <video id="local-video" autoplay muted playsinline></video>

            <div class="btn-row">
                <button class="ctrl-btn btn-start" id="btnStart">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
                    </svg>
                    Start Call
                </button>
                <button class="ctrl-btn btn-end" id="btnEnd" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08C.11 12.9 0 12.65 0 12.37c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.66c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                    </svg>
                    End Call
                </button>
            </div>

            <div class="btn-row">
                <button class="ctrl-btn btn-toggle active" id="btnMute" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                    <span id="labelMute">Mute</span>
                </button>
                <button class="ctrl-btn btn-toggle off" id="btnVideo" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18 10.48V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-4.48l4 3.98v-11l-4 3.98zm-2-.79V18H4V6h12v3.69z"/>
                    </svg>
                    <span id="labelVideo">Start Video</span>
                </button>
            </div>
        </div>

        <!-- ── Chat Panel ── -->
        <div id="panelChat" class="call-controls" style="display:none;width:100%">
            <div class="call-status" id="chatStatus">Ready to connect</div>

            <div class="chat-window" id="chatWindow">
                <div class="chat-messages" id="chatMessages"></div>

                <div class="typing-indicator" id="typingIndicator">
                    <span>Agent is typing</span>
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." disabled autocomplete="off">
                    <button class="ctrl-btn btn-send" id="btnSend" disabled>
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="btn-row">
                <button class="ctrl-btn btn-start" id="btnStartChat">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                    </svg>
                    Start Chat
                </button>
                <button class="ctrl-btn btn-end" id="btnEndChat" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                    End Chat
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="libs/amazon-connect-chat.js"></script>

    <script type="module">
        import {
            ConsoleLogger,
            DefaultDeviceController,
            DefaultMeetingSession,
            LogLevel,
            MeetingSessionConfiguration,
            MeetingSessionStatusCode
        } from 'https://esm.sh/amazon-chime-sdk-js@3';

        const API_ENDPOINT = 'https://1527omusic.execute-api.us-east-1.amazonaws.com/dev/communication-widget';

        // ── Tab switching ─────────────────────────────────────────────────────

        const tabCall     = document.getElementById('tabCall');
        const tabChat     = document.getElementById('tabChat');
        const panelCall   = document.getElementById('panelCall');
        const panelChat   = document.getElementById('panelChat');
        const zebContainer = document.getElementById('zebContainer');

        tabCall.addEventListener('click', () => {
            tabCall.classList.add('active');
            tabChat.classList.remove('active');
            panelCall.style.display = '';
            panelChat.style.display = 'none';
            zebContainer.classList.remove('chat-active');
        });

        tabChat.addEventListener('click', () => {
            tabChat.classList.add('active');
            tabCall.classList.remove('active');
            panelChat.style.display = '';
            panelCall.style.display = 'none';
            zebContainer.classList.add('chat-active');
        });

        // ════════════════════════════════════════════════════════════════════
        // VOICE CALL
        // ════════════════════════════════════════════════════════════════════

        let meetingSession = null;
        let isMuted  = false;
        let isVideoOn = false;

        const btnStart   = document.getElementById('btnStart');
        const btnEnd     = document.getElementById('btnEnd');
        const btnMute    = document.getElementById('btnMute');
        const btnVideo   = document.getElementById('btnVideo');
        const callStatus = document.getElementById('callStatus');
        const localVideo = document.getElementById('local-video');
        const labelMute  = document.getElementById('labelMute');
        const labelVideo = document.getElementById('labelVideo');

        function setCallStatus(msg, type = '') {
            callStatus.textContent = msg;
            callStatus.className = 'call-status' + (type ? ' ' + type : '');
        }

        function setCallActive(active) {
            btnStart.disabled = active;
            btnEnd.disabled   = !active;
            btnMute.disabled  = !active;
            btnVideo.disabled = !active;
        }

        btnStart.addEventListener('click', async () => {
            setCallStatus('Connecting...', '');
            btnStart.disabled = true;

            try {
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ParticipantDetails: { DisplayName: 'ZEB Customer' } })
                });

                if (!res.ok) throw new Error(`API error ${res.status}`);
                const data = await res.json();
                const { Meeting, Attendee } = data.ConnectionData;

                const logger           = new ConsoleLogger('ZEB-Chime', LogLevel.WARN);
                const deviceController = new DefaultDeviceController(logger);
                const config           = new MeetingSessionConfiguration({ Meeting }, { Attendee });

                meetingSession = new DefaultMeetingSession(config, logger, deviceController);

                const audioInputs = await meetingSession.audioVideo.listAudioInputDevices();
                if (audioInputs.length > 0) {
                    await meetingSession.audioVideo.startAudioInput(audioInputs[0].deviceId);
                }

                const audioEl = document.createElement('audio');
                audioEl.style.display = 'none';
                document.body.appendChild(audioEl);
                meetingSession.audioVideo.bindAudioElement(audioEl);

                meetingSession.audioVideo.addObserver({
                    audioVideoDidStop(status) {
                        const code = status.statusCode();
                        const shouldReset =
                            code === MeetingSessionStatusCode.MeetingEnded ||
                            code === MeetingSessionStatusCode.Left ||
                            code === MeetingSessionStatusCode.SignalingChannelClosedUnexpectedly ||
                            code === MeetingSessionStatusCode.SignalingBadRequest ||
                            code === MeetingSessionStatusCode.TaskFailed;

                        if (shouldReset) {
                            const wasUnexpected = code === MeetingSessionStatusCode.SignalingChannelClosedUnexpectedly;
                            setCallStatus(wasUnexpected ? 'Call disconnected unexpectedly' : 'Call ended', wasUnexpected ? 'error' : '');
                            setCallActive(false);
                            stopVideoLocal();
                            meetingSession = null;
                        }
                    },
                    videoTileDidUpdate(tileState) {
                        if (!meetingSession || !tileState.localTile) return;
                        meetingSession.audioVideo.bindVideoElement(tileState.tileId, localVideo);
                        localVideo.style.display = 'block';
                    }
                });

                meetingSession.audioVideo.start();
                setCallStatus('Connected', 'active');
                setCallActive(true);
                isMuted   = false;
                isVideoOn = false;
                syncMuteUI();
                syncVideoUI();

            } catch (err) {
                console.error('Start call failed:', err);
                setCallStatus('Failed to connect — ' + err.message, 'error');
                btnStart.disabled = false;
            }
        });

        btnEnd.addEventListener('click', async () => {
            if (!meetingSession) return;
            await stopVideoLocal();
            meetingSession.audioVideo.stop();
            setCallStatus('Call ended', '');
            setCallActive(false);
            meetingSession = null;
        });

        btnMute.addEventListener('click', () => {
            if (!meetingSession) return;
            if (isMuted) {
                meetingSession.audioVideo.realtimeUnmuteLocalAudio();
                isMuted = false;
            } else {
                meetingSession.audioVideo.realtimeMuteLocalAudio();
                isMuted = true;
            }
            syncMuteUI();
        });

        function syncMuteUI() {
            if (isMuted) {
                labelMute.textContent = 'Unmute';
                btnMute.classList.remove('active');
                btnMute.classList.add('off');
            } else {
                labelMute.textContent = 'Mute';
                btnMute.classList.add('active');
                btnMute.classList.remove('off');
            }
        }

        btnVideo.addEventListener('click', async () => {
            if (!meetingSession) return;
            isVideoOn ? await stopVideoLocal() : await startVideoLocal();
        });

        async function startVideoLocal() {
            try {
                const videoInputs = await meetingSession.audioVideo.listVideoInputDevices();
                if (videoInputs.length === 0) { setCallStatus('No camera found', 'error'); return; }
                await meetingSession.audioVideo.startVideoInput(videoInputs[0].deviceId);
                meetingSession.audioVideo.startLocalVideoTile();
                isVideoOn = true;
                syncVideoUI();
            } catch (err) {
                setCallStatus('Camera error — ' + err.message, 'error');
            }
        }

        async function stopVideoLocal() {
            if (!meetingSession) return;
            try {
                meetingSession.audioVideo.stopLocalVideoTile();
                await meetingSession.audioVideo.stopVideoInput();
            } catch (_) {}
            localVideo.style.display = 'none';
            localVideo.srcObject = null;
            isVideoOn = false;
            syncVideoUI();
        }

        function syncVideoUI() {
            if (isVideoOn) {
                labelVideo.textContent = 'Stop Video';
                btnVideo.classList.add('active');
                btnVideo.classList.remove('off');
            } else {
                labelVideo.textContent = 'Start Video';
                btnVideo.classList.remove('active');
                btnVideo.classList.add('off');
            }
        }

        // ════════════════════════════════════════════════════════════════════
        // CHAT
        // ════════════════════════════════════════════════════════════════════

        // ChatJS is loaded as a regular script and exposes window.connect
        const ChatSession = window.connect.ChatSession;
        ChatSession.setGlobalConfig({ region: 'us-east-1' });

        let chatSession    = null;
        let typingTimeout  = null;
        let isTypingSent   = false;

        const btnStartChat    = document.getElementById('btnStartChat');
        const btnEndChat      = document.getElementById('btnEndChat');
        const btnSend         = document.getElementById('btnSend');
        const chatInput       = document.getElementById('chatInput');
        const chatMessages    = document.getElementById('chatMessages');
        const chatWindow      = document.getElementById('chatWindow');
        const chatStatus      = document.getElementById('chatStatus');
        const typingIndicator = document.getElementById('typingIndicator');

        function setChatStatus(msg, type = '') {
            chatStatus.textContent = msg;
            chatStatus.className = 'call-status' + (type ? ' ' + type : '');
        }

        function setChatActive(active) {
            btnStartChat.disabled = active;
            btnEndChat.disabled   = !active;
            btnSend.disabled      = !active;
            chatInput.disabled    = !active;
            chatWindow.classList.toggle('visible', active);
            if (active) chatInput.focus();
        }

        function appendMessage(role, content, displayName) {
            const wrap = document.createElement('div');
            wrap.className = 'chat-message ' + (
                role === 'CUSTOMER' ? 'msg-customer' :
                role === 'AGENT'    ? 'msg-agent'    : 'msg-system'
            );

            if (role !== 'SYSTEM') {
                const name = document.createElement('div');
                name.className   = 'msg-name';
                name.textContent = displayName || (role === 'CUSTOMER' ? 'You' : 'Agent');
                wrap.appendChild(name);
            }

            const bubble = document.createElement('div');
            bubble.className   = 'msg-bubble';
            bubble.textContent = content;
            wrap.appendChild(bubble);

            chatMessages.appendChild(wrap);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendSystemEvent(text) {
            const el = document.createElement('div');
            el.className   = 'chat-message msg-system';
            el.textContent = text;
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        btnStartChat.addEventListener('click', async () => {
            setChatStatus('Connecting...', '');
            btnStartChat.disabled = true;

            try {
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'chat',
                        ParticipantDetails: { DisplayName: 'ZEB Customer' },
                        SupportedMessagingContentTypes: ['text/plain', 'text/markdown'],
                        ChatDurationInMinutes: 1500
                    })
                });

                if (!res.ok) throw new Error(`API error ${res.status}`);
                const result = await res.json();

                chatSession = ChatSession.create({
                    chatDetails: result.data.startChatResult,
                    type: 'CUSTOMER'
                });

                chatSession.onConnectionEstablished(() => {
                    setChatStatus('Connected', 'active');
                    setChatActive(true);
                    appendSystemEvent('Chat started — an agent will be with you shortly.');
                });

                chatSession.onMessage(({ data }) => {
                    if (data.Type !== 'MESSAGE') return;
                    if (data.ParticipantRole === 'CUSTOMER') return;
                    if (data.ContentType === 'text/plain' || data.ContentType === 'text/markdown') {
                        typingIndicator.classList.remove('visible');
                        appendMessage(data.ParticipantRole, data.Content, data.DisplayName);
                    }
                });

                chatSession.onTyping(({ data }) => {
                    if (data.ParticipantRole === 'AGENT') {
                        typingIndicator.classList.add('visible');
                        clearTimeout(typingTimeout);
                        typingTimeout = setTimeout(() => typingIndicator.classList.remove('visible'), 3000);
                    }
                });

                chatSession.onChatDisconnected(() => {
                    appendSystemEvent('Chat ended.');
                    setChatStatus('Chat ended', '');
                    setChatActive(false);
                    chatSession = null;
                });

                chatSession.onConnectionBroken(() => {
                    appendSystemEvent('Connection lost.');
                    setChatStatus('Connection lost', 'error');
                    setChatActive(false);
                    chatSession = null;
                });

                await chatSession.connect();

            } catch (err) {
                console.error('Start chat failed:', err);
                setChatStatus('Failed to connect — ' + err.message, 'error');
                btnStartChat.disabled = false;
            }
        });

        btnEndChat.addEventListener('click', () => {
            if (!chatSession) return;
            chatSession.controller.disconnectParticipant();
        });

        function sendMessage() {
            if (!chatSession) return;
            const message = chatInput.value.trim();
            if (!message) return;
            chatSession.controller.sendMessage({ message, contentType: 'text/plain' });
            appendMessage('CUSTOMER', message, 'You');
            chatInput.value = '';
            isTypingSent = false;
        }

        btnSend.addEventListener('click', sendMessage);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        chatInput.addEventListener('input', () => {
            if (!chatSession || isTypingSent) return;
            isTypingSent = true;
            chatSession.controller.sendEvent({ contentType: 'application/vnd.amazonaws.connect.event.typing' });
            setTimeout(() => { isTypingSent = false; }, 3000);
        });

        // ── Shared: ZEB ripple + parallax ─────────────────────────────────

        const zebText = document.getElementById('zebText');
        zebText.addEventListener('click', function (e) {
            const ripple = document.createElement('div');
            const rect   = zebText.getBoundingClientRect();
            const size   = 60;
            ripple.style.cssText = `
                position:absolute;width:${size}px;height:${size}px;
                left:${e.clientX - rect.left - size / 2}px;
                top:${e.clientY - rect.top - size / 2}px;
                background:radial-gradient(circle,var(--grass-green) 0%,transparent 70%);
                border-radius:50%;transform:scale(0);
                animation:ripple 0.6s ease-out;pointer-events:none;
            `;
            zebText.style.position = 'relative';
            zebText.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth)  * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, var(--grass-green) 0%, var(--swamp-green) 50%, #2d3d0f 100%)`;
        });
    </script>

</body>
</html>
