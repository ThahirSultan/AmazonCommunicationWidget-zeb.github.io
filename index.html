<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --swamp-green: #4a5d23;
            --grass-green: #7cb342;
            --dark-black: #000000;
        }

        body {
            background: linear-gradient(135deg, var(--swamp-green) 0%, var(--grass-green) 50%, var(--swamp-green) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        .zeb-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 4rem 6rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 3px solid var(--grass-green);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .zeb-text {
            font-size: 8rem;
            font-weight: bold;
            color: var(--grass-green);
            text-shadow:
                0 0 10px var(--grass-green),
                0 0 20px var(--grass-green),
                0 0 30px var(--grass-green);
            letter-spacing: 0.5rem;
            animation: pulse 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .zeb-text:hover {
            color: #ffffff;
            text-shadow:
                0 0 15px var(--grass-green),
                0 0 25px var(--grass-green),
                0 0 35px var(--grass-green),
                0 0 45px var(--grass-green);
            transform: scale(1.1);
        }

        @keyframes glow {
            from {
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px var(--swamp-green);
            }

            to {
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px var(--grass-green);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }
        }

        /* Floating particles effect */
        .particle {
            position: absolute;
            background: var(--grass-green);
            border-radius: 50%;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.6;
            }

            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 1;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .zeb-text {
                font-size: 4rem;
                letter-spacing: 0.3rem;
            }

            .zeb-container {
                padding: 2rem 3rem;
                margin: 1rem;
            }
        }

        @media (max-width: 480px) {
            .zeb-text {
                font-size: 3rem;
                letter-spacing: 0.2rem;
            }

            .zeb-container {
                padding: 1.5rem 2rem;
            }
        }

        /* Ensure the widget doesn't interfere with the main content */
        .main-content {
            position: relative;
            z-index: 1;
        }

        .call-btn {
            margin-top: 2rem;
            padding: 0.75rem 2.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: var(--grass-green);
            border: 2px solid var(--grass-green);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.1rem;
        }

        .call-btn:hover {
            background-color: var(--swamp-green);
            border-color: var(--grass-green);
            box-shadow: 0 0 15px var(--grass-green);
        }
    </style>
</head>

<body>
    <div class="container-fluid main-content">
        <div class="zeb-container">
            <h1 class="zeb-text" id="zebText">ZEB</h1>
            <button class="call-btn" id="callBtn">Call ZEB</button>
        </div>
    </div>

    <!-- Floating particles -->
    <div class="particle" style="top: 10%; left: 10%; width: 4px; height: 4px; animation-delay: 0s;"></div>
    <div class="particle" style="top: 20%; right: 20%; width: 6px; height: 6px; animation-delay: 1s;"></div>
    <div class="particle" style="bottom: 30%; left: 30%; width: 3px; height: 3px; animation-delay: 2s;"></div>
    <div class="particle" style="bottom: 20%; right: 10%; width: 5px; height: 5px; animation-delay: 3s;"></div>
    <div class="particle" style="top: 50%; left: 5%; width: 4px; height: 4px; animation-delay: 4s;"></div>
    <div class="particle" style="top: 70%; right: 5%; width: 3px; height: 3px; animation-delay: 5s;"></div>

    <!-- ChatJS loaded locally -->
    <script src="libs/amazon-connect-chat.js"></script>

    <!-- Amazon Connect - Direct Hosted Backend Integration -->
    <script type="text/javascript">
        const AC_CONFIG = {
            instanceAlias: 'nova-sonic-connect-poc',
            widgetId: 'a2bc9174-3fe1-4ed0-96ae-c945223ab982',
            snippetId: 'QVFJREFIaXdlaTllQXR1SnQyK1JZc1Z3dWE3clBZQjQvWm15emlVb25scEltc3BJNmdHLzJYeTlFRFJicCtxMUY0aGpuekNhQUFBQWJqQnNCZ2txaGtpRzl3MEJCd2FnWHpCZEFnRUFNRmdHQ1NxR1NJYjNEUUVIQVRBZUJnbGdoa2dCWlFNRUFTNHdFUVFNbkZjYVMxU2dNVVRmSlI4SkFnRVFnQ3RHZEZMbEVkV2Z4cGptY0dSclBaNVpjT1VZVXVTSmJPWGdySkd4VGxteVNDSVN0dmtEQWl4cTVaQkc6OityU1g0N0U5Y29MK3BDWHhDd0ZsVURjUTRzT3B4NlQyOFNRR0RvbFBFaCt1WmJ5TGszb2pNTGxGcmhPZ21DNzVvdEVFQ3FOTTVBSm0xbWdzemtBUktxcHU0VHN1Y3BnR3Z0RFNsWmx4cU1rK1F4WTM0SmgybkZkaGFYNEl1UnRQeWczdVp6MzJ0UHgycENEdS9FM3hVYzFkWWdXb1dJVT0=',
            region: 'us-east-1'
        };

        let activeChatSession = null;

        connect.ChatSession.setGlobalConfig({
            region: AC_CONFIG.region,
            loggerConfig: {
                level: connect.ChatSession.LogLevel.INFO
            },
        });

        async function startCall() {
            const btn = document.getElementById('callBtn');

            // Prevent double-clicks while connecting
            if (activeChatSession) {
                console.log('Session already active');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Connecting...';

            try {
                // Step 1: Call the Amazon-hosted backend to start the contact
                const endpoint = `https://${AC_CONFIG.instanceAlias}.my.connect.aws/connectwidget/api/${AC_CONFIG.widgetId}/start`;

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-amz-snippet-id': AC_CONFIG.snippetId
                    },
                    body: JSON.stringify({
                        SupportedMessagingContentTypes: ['text/plain']
                    })
                });

                if (!response.ok) {
                    throw new Error(`Backend responded with ${response.status}`);
                }

                const data = await response.json();
                console.log('Chat contact started:', data);

                // Step 2: Extract credentials - adjust path based on actual response shape
                const chatDetails = data.startChatResult || (data.data && data.data.startChatResult) || data;

                // Step 3: Create and connect the ChatJS session
                activeChatSession = connect.ChatSession.create({
                    chatDetails: {
                        contactId: chatDetails.ContactId,
                        participantId: chatDetails.ParticipantId,
                        participantToken: chatDetails.ParticipantToken,
                    },
                    options: {
                        region: AC_CONFIG.region
                    },
                    type: connect.ChatSession.SessionTypes.CUSTOMER,
                    disableCSM: true
                });

                await activeChatSession.connect();
                console.log('ChatJS session connected');

                btn.textContent = 'End Call';
                btn.disabled = false;
                btn.onclick = endCall;

                // Step 4: Handle session events
                activeChatSession.onConnectionEstablished(() => {
                    console.log('Connection established');
                });

                activeChatSession.onEnded(() => {
                    console.log('Call ended by agent');
                    resetButton();
                });

                activeChatSession.onConnectionLost(() => {
                    console.warn('Connection lost');
                });

            } catch (err) {
                console.error('Failed to start call:', err);
                resetButton();
            }
        }

        async function endCall() {
            if (activeChatSession) {
                try {
                    await activeChatSession.disconnectParticipant();
                } catch (e) {
                    console.warn('Error disconnecting:', e);
                }
            }
            resetButton();
        }

        function resetButton() {
            activeChatSession = null;
            const btn = document.getElementById('callBtn');
            btn.textContent = 'Call ZEB';
            btn.disabled = false;
            btn.onclick = startCall;
        }

        // Attach initial click handler once DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('callBtn').addEventListener('click', startCall);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Interactive effects for ZEB text
        document.addEventListener('DOMContentLoaded', function() {
            const zebText = document.getElementById('zebText');

            // Click effect
            zebText.addEventListener('click', function() {
                this.style.animation = 'none';
                setTimeout(() => {
                    this.style.animation = 'pulse 3s ease-in-out infinite';
                }, 100);

                // Create ripple effect
                createRipple(event);
            });

            // Create ripple effect function
            function createRipple(e) {
                const ripple = document.createElement('div');
                const rect = zebText.getBoundingClientRect();
                const size = 60;
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                ripple.style.cssText = `
                    position: absolute;
                    width: ${size}px;
                    height: ${size}px;
                    left: ${x}px;
                    top: ${y}px;
                    background: radial-gradient(circle, var(--grass-green) 0%, transparent 70%);
                    border-radius: 50%;
                    transform: scale(0);
                    animation: ripple 0.6s ease-out;
                    pointer-events: none;
                `;

                zebText.style.position = 'relative';
                zebText.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            }

            // Add ripple animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes ripple {
                    to {
                        transform: scale(4);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);

            // Random color variations on mouse movement
            document.addEventListener('mousemove', function(e) {
                const x = (e.clientX / window.innerWidth) * 100;
                const y = (e.clientY / window.innerHeight) * 100;

                document.body.style.background = `
                    radial-gradient(circle at ${x}% ${y}%, 
                    var(--grass-green) 0%, 
                    var(--swamp-green) 50%, 
                    #2d3d0f 100%)
                `;
            });

            // Keyboard interaction
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' || e.code === 'Enter') {
                    zebText.click();
                }
            });

            // Amazon Connect widget integration message
            console.log('Amazon Connect Communications Widget loaded successfully!');

            // Optional: Listen for widget events
            window.addEventListener('message', function(event) {
                if (event.data && event.data.type === 'amazonConnectChatWidget') {
                    console.log('Amazon Connect Widget Event:', event.data);
                }
            });
        });
    </script>
</body>

</html>
